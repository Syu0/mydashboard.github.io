<!doctype html><meta charset="utf-8"><title>backlog check</title>
<style>body{font:14px -apple-system,sans-serif;padding:24px;background:#111;color:#eee}
b{color:#7bdcb5}i{color:#ff8f8f;font-style:normal}pre{white-space:pre-wrap}</style>
<h3>backlog 연결 진단</h3><pre id="o">실행 중…</pre>
<script src="backlog.js"></script>
<script>
const out=[];
function log(s){out.push(s);document.getElementById("o").innerHTML=out.join("\n");}
(async()=>{
  log("build: <b>"+BACKLOG_BUILD+"</b>");
  log("endpoint: "+BACKLOG_API);
  const t0=performance.now();
  try{
    const r=await fetch(BACKLOG_API+"/health",{cache:"no-store"});
    log("health: <b>HTTP "+r.status+"</b>  ("+Math.round(performance.now()-t0)+"ms)");
    log("CORS 통과: <b>예</b> — 응답 본문 읽기 성공: "+JSON.stringify(await r.json()));
  }catch(e){
    log("health: <i>실패 "+e.name+" — "+e.message+"</i>");
    log("→ DNS/연결/TLS/CORS 중 하나. 이 기기가 MagicDNS 를 안 쓰는 상태일 가능성이 높음.");
  }
  const saved=localStorage.getItem("backlogToken");
  log("저장된 토큰: "+(saved?"있음("+saved.length+"자)":"없음"));
  document.title="done";
})();
</script>
